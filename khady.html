<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Khady's</div>

        <ul class="navlinks">
          <li class="active">Home</li>
          <li>Menu <i class="fa-solid fa-angle-down"></i></li>
          <li>Orders</li>
          <li>Outlet</li>
        </ul>

        <div class="nav-icons">
          <div class="search-container">
            <input type="text" placeholder="Search food..." />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>0</span>
          </div>
        </div>
      </nav>

      <section class="body">
        <div class="body-left">
          <div class="welcome-text">Welcome</div>
          <div class="heading">Enjoy Your <br /></div>
          <span class="highlight">Delicious Food</span>
        </div>

        <div class="text">
          We well serve tasty food, 100% pure & fresh, hot - <br />with love, so
          you would love it even more.
        </div>

        <div class="button">
          <button class="order-btn">Order Now</button>
          <div class="play-btn">
            <i class="fa-solid fa-play"></i>
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
